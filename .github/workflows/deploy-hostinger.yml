name: Publicar branch Hostinger

on:
  # A publicação só começa depois que a CI da main termina.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: SHA completo de um commit já presente na main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Atualizar hostinger-pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-hostinger
      url: https://simulador-parcelas.wasxtech.com.br
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha }}

    steps:
      - name: Validar token de publicação
        shell: bash
        env:
          PAGES_TOKEN: ${{ secrets.HOSTINGER_PAGES_TOKEN }}
        run: |
          if [[ -z "$PAGES_TOKEN" ]]; then
            echo '::error::Erro: HOSTINGER_PAGES_TOKEN não configurado no ambiente production-hostinger.'
            exit 1
          fi

      # PAT dedicado: o push precisa gerar o evento que alimenta o webhook externo.
      - name: Baixar o commit aprovado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          token: ${{ secrets.HOSTINGER_PAGES_TOKEN }}
          persist-credentials: true

      - name: Validar SHA e vínculo com main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

      - name: Preparar raiz estática isolada
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_DIR="$RUNNER_TEMP/hostinger-pages"
          mkdir -p "$PUBLIC_DIR"
          cp frontend/index.html frontend/style.css frontend/script.js "$PUBLIC_DIR/"
          python scripts/validar_publicacao.py
          python - "$PUBLIC_DIR/index.html" "$DEPLOY_SHA" <<'PYTHON'
          from pathlib import Path
          import sys
          caminho = Path(sys.argv[1])
          sha = sys.argv[2]
          html = caminho.read_text(encoding='utf-8')
          marca = f'  <meta name="deployment-commit" content="{sha}">\n'
          if '</head>' not in html:
              raise SystemExit('index.html sem fechamento </head>.')
          caminho.write_text(html.replace('</head>', marca + '</head>', 1), encoding='utf-8')
          PYTHON
          test "$(find "$PUBLIC_DIR" -maxdepth 1 -type f | wc -l)" -eq 3
          test -f "$PUBLIC_DIR/index.html"
          test -f "$PUBLIC_DIR/style.css"
          test -f "$PUBLIC_DIR/script.js"

      - name: Criar commit público e atualizar branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_DIR="$RUNNER_TEMP/hostinger-pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin refs/heads/hostinger-pages >/dev/null 2>&1; then
            git fetch --no-tags origin hostinger-pages
            git switch -C hostinger-pages origin/hostinger-pages
          else
            git switch --orphan hostinger-pages
          fi
          git rm -r -f --ignore-unmatch .
          cp "$PUBLIC_DIR/index.html" "$PUBLIC_DIR/style.css" "$PUBLIC_DIR/script.js" .
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          git add index.html style.css script.js
          # --allow-empty permite reacionar o webhook para o mesmo SHA após a configuração inicial.
          git commit --allow-empty -m "publish: frontend de $DEPLOY_SHA"
          git push origin HEAD:hostinger-pages
          echo "public_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # O hPanel recebe o push por webhook; a marca confirma o SHA realmente servido.
      - name: Verificar publicação da Hostinger
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://simulador-parcelas.wasxtech.com.br'
          for tentativa in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 \
              "$SITE/?sha=$DEPLOY_SHA&tentativa=$tentativa" -o pagina.html && \
              grep -Fq "deployment-commit\" content=\"$DEPLOY_SHA" pagina.html; then
              echo "Hostinger publicou o SHA $DEPLOY_SHA."
              exit 0
            fi
            sleep 10
          done
          echo '::error::A branch foi atualizada, mas o SHA não apareceu no domínio dentro do prazo.'
          exit 1
