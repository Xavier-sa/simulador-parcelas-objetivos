name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A CI apenas lê o código; não precisa escrever no repositório.
permissions:
  contents: read

jobs:
  validar:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # SHA fixo evita que uma tag alterada execute código diferente no runner.
      - name: Baixar o commit exato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false

      - name: Configurar Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node.js 24
        with:
          python-version: '3.12'

      - name: Verificar sintaxe Python
        run: python -m compileall -q api backend scripts/validar_publicacao.py scripts/verificar_deploy.py

      - name: Conferir regressão financeira histórica
        run: python -m unittest discover -s backend -p "test_historico_financeiro.py"

      - name: Executar todos os testes
        run: python -m unittest discover -s backend -p "test_*.py"

      # node --check analisa a sintaxe sem executar o JavaScript no navegador.
      - name: Verificar sintaxe JavaScript
        run: |
          node --check frontend/script.js
          node --check deploy/hostinger/script.js

      - name: Validar arquivos, JSON e privacidade
        run: python scripts/validar_publicacao.py
