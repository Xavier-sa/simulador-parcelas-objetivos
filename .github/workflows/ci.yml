name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A CI apenas lê o código; não precisa escrever no repositório.
permissions:
  contents: read

jobs:
  validar:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # SHA fixo evita que uma tag alterada execute código diferente no runner.
      - name: Baixar o commit exato
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verificar sintaxe Python
        run: python -m compileall -q api backend scripts/validar_publicacao.py

      - name: Conferir regressão financeira histórica
        run: python -m unittest discover -s backend -p "test_historico_financeiro.py"

      - name: Executar todos os testes
        run: python -m unittest discover -s backend -p "test_*.py"

      # node --check analisa a sintaxe sem executar o JavaScript no navegador.
      - name: Verificar sintaxe JavaScript
        run: |
          node --check frontend/config.js
          node --check frontend/script.js
          node --check deploy/hostinger/config.js
          node --check deploy/hostinger/script.js

      - name: Validar arquivos, JSON e privacidade
        run: python scripts/validar_publicacao.py
